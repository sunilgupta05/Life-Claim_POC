# RabbitMQ broker (AMQP 5672, management UI 15672 — both internal only).
#
# Credentials = RABBITMQ_USER / RABBITMQ_PASS from the life-claim-secrets Secret
# (i.e. life-claim-backend/.env), so backend, worker and broker always agree.
# `loopback_users = none` lets that user connect over the network even when it
# is `guest` (RabbitMQ otherwise allows guest from localhost only).
#
# Single node with a fixed node name (rabbit@localhost) so the durable queues on
# the PVC survive pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: { app: rabbitmq }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 1500       # matches the 20 min startup budget below
  strategy: { type: Recreate }       # one writer on the RWO volume
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999                  # `rabbitmq` user in the image owns the data dir
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: life-claim-secrets, key: RABBITMQ_USER, optional: true }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: life-claim-secrets, key: RABBITMQ_PASS, optional: true }
            - name: RABBITMQ_NODENAME
              value: rabbit@localhost
            # containerd gives containers an open-files limit of ~1e9; Erlang sizes
            # its port table from it and the broker hangs during boot (the AMQP
            # listener never opens). Cap it at 65536 for the server and CLI tools.
            - name: ERL_MAX_PORTS
              value: "65536"
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "+Q 65536 +S 2:2 -rabbit loopback_users []"
            - name: RABBITMQ_CTL_ERL_ARGS
              value: "+Q 65536"
          # TCP checks on the AMQP port: the listener only opens once the broker
          # accepts connections. (`rabbitmq-diagnostics` boots a separate Erlang
          # VM per call and timed out on the busy server.)
          # Up to 20 min: on a loaded host the first boot (metadata store init)
          # took >5 min, and a restart mid-boot starts it over from scratch.
          startupProbe:
            tcpSocket: { port: amqp }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket: { port: amqp }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: amqp }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            # No CPU limit: CFS throttling of Erlang's scheduler threads made boot
            # crawl; +S 2:2 above keeps it to two scheduler threads instead.
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rabbitmq-data }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: { app: rabbitmq }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
---
# Only the backend (publisher, integration health check) and worker (consumer)
# may reach the broker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-from-backend-and-worker
spec:
  podSelector:
    matchLabels: { app: rabbitmq }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [backend, worker] }
      ports:
        - { port: 5672 }
        - { port: 15672 }
