# Container-specific settings only. Everything else — DB, Redis, RabbitMQ,
# Keycloak, TXN API, Alfresco, WhatsApp, mail and all passwords — comes from the
# Secret `life-claim-secrets`, which deploy.ps1 / deploy.sh create from
# life-claim-backend/.env.
#
# Pods list the Secret FIRST and this ConfigMap LAST in envFrom, so a key set
# here wins over the same key in .env (e.g. .env has RULES_ENGINE_URL=localhost
# and USE_HTTPS=true, which are wrong inside the cluster).
apiVersion: v1
kind: ConfigMap
metadata:
  name: life-claim-config
data:
  NODE_ENV: "production"           # JSON logs, Secure cookies, HTTPS-only login
  HOST: "0.0.0.0"
  PORT: "3010"
  USE_HTTPS: "false"               # TLS terminates at the Ingress; pods speak HTTP
  TRUST_PROXY: "true"              # one proxy hop -> real client IP + X-Forwarded-Proto
  REQUIRE_HTTPS_AUTH: "true"
  API_DOCS_ENABLED: "false"
  LOG_TO_FILE: "false"             # stdout only; the cluster log agent collects it
  RULES_ENGINE_ENABLED: "true"
  RULES_ENGINE_URL: "http://rules:8095"
  # Browser origin(s) of the app — overlays replace this.
  CORS_ALLOWED_ORIGINS: "https://claims.example.com"
