# kustomize entrypoint (roadmap 4.2).  kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: life-claim
resources:
  - app.yaml
  - data.yaml          # in-cluster MySQL/RabbitMQ/Redis; remove if using managed services

# Images are pulled from Docker Hub. Replace DOCKERHUB_USER with your Docker Hub
# username (the same one you `docker push` to). Bump newTag per release (prefer a
# version like v2.0.0 over :latest so rollouts are deterministic).
images:
  - name: life-claim-backend
    newName: docker.io/DOCKERHUB_USER/life-claim-backend
    newTag: latest
  - name: life-claim-frontend
    newName: docker.io/DOCKERHUB_USER/life-claim-frontend
    newTag: latest
  - name: life-claim-rules
    newName: docker.io/DOCKERHUB_USER/life-claim-rules
    newTag: latest
