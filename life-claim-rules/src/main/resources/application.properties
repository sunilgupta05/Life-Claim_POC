server.port=8095
spring.application.name=life-claim-rules

# Shared secret required on X-Internal-Api-Key for all /api/rules/** calls (server-to-server only).
# Must match RULES_ENGINE_API_KEY in life-claim-backend/.env. Override in production.
rules.engine.api-key=${RULES_ENGINE_API_KEY:dev-only-change-me}
